<header class="header">
  <div class="container">
    <nav class="navbar">
      <div class="logo">
        <h2 class="logo-text">Sergio Losada</h2>
        <span class="logo-subtitle">Software Engineer</span>
      </div>
      
      <ul class="nav-menu" [class.active]="isMenuOpen">
        <li class="nav-item">
          <a href="#profile" class="nav-link" (click)="scrollToSection('profile', $event)">{{ text.navProfile }}</a>
        </li>
        <li class="nav-item">
          <a href="#experience" class="nav-link" (click)="scrollToSection('experience', $event)">{{ text.navExperience }}</a>
        </li>
        <li class="nav-item">
          <a href="#projects" class="nav-link" (click)="scrollToSection('projects', $event)">{{ text.navProjects }}</a>
        </li>
        <li class="nav-item">
          <a href="#contact" class="nav-link" (click)="scrollToSection('contact', $event)">{{ text.navContact }}</a>
        </li>
      </ul>

      <div class="nav-actions">
        <div class="language-switcher" aria-label="Language selector">
          <button
            type="button"
            class="language-button"
            [class.active]="currentLanguage === 'es'"
            (click)="setLanguage('es', $event)"
          >
            ES
          </button>
          <button
            type="button"
            class="language-button"
            [class.active]="currentLanguage === 'en'"
            (click)="setLanguage('en', $event)"
          >
            EN
          </button>
        </div>

        <div class="hamburger" [class.active]="isMenuOpen" (click)="toggleMenu()">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </div>
    </nav>
  </div>
</header>
